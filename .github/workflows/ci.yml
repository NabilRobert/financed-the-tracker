# Lint, types and tests on every push and pull request. No secrets, no model
# calls and no network beyond installing the pinned tools, so it costs nothing.
# TRACKER_REQUIRE_DB turns a missing test database from a skip into a failure.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          # A throwaway server for the tests only, never real data.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRACKER_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      # --locked fails if uv.lock no longer matches pyproject.toml.
      - run: uv sync --locked --python 3.12
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pyright
      - run: uv run --frozen pytest
