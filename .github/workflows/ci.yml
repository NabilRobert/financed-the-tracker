# Lint, types, tests, a secret scan and a dependency audit on every push and
# pull request. No secrets and no model calls, so it costs nothing. The only
# network use is installing pinned tools and uv audit's advisory lookup.
# TRACKER_REQUIRE_DB turns a missing test database from a skip into a failure.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          # A throwaway server for the tests only, never real data.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRACKER_REQUIRE_DB: "1"
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans every commit, not only the last one.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      # --locked fails if uv.lock no longer matches pyproject.toml.
      - run: uv sync --locked --python 3.12
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pyright
      - run: uv run --frozen pytest
      - name: Install gitleaks, checked against its published checksum
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archive}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${archive}$" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - run: gitleaks git --no-banner --redact .
      # Fails on any known vulnerability in uv.lock. The uv version above is pinned, so
      # the preview flag can't change under us.
      - run: uv audit --frozen --preview-features audit-command
