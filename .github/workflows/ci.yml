# Lint, types and tests on every push and pull request. No secrets, no model
# calls and no network beyond installing the pinned tools, so it costs nothing.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      # --locked fails if uv.lock no longer matches pyproject.toml.
      - run: uv sync --locked --python 3.12
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pyright
      - run: uv run --frozen pytest
